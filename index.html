<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칸반보드</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-logo">
      <h1>칸반보드</h1>
      <p>업무를 한눈에 관리하세요</p>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" id="login-tab">로그인</button>
      <button class="tab-btn" id="signup-tab">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form id="login-form" class="auth-form active" novalidate>
      <div class="form-group">
        <label for="login-username">아이디</label>
        <input type="text" id="login-username" placeholder="아이디 입력" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">비밀번호</label>
        <input type="password" id="login-password" placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <p class="form-message" id="login-msg"></p>
      <button type="submit" class="btn-primary full">로그인</button>
      <div class="divider"><span>또는</span></div>
      <button type="button" class="btn-google" id="google-btn">
        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        Google로 로그인
      </button>
    </form>

    <!-- 회원가입 -->
    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="signup-name">이름</label>
        <input type="text" id="signup-name" placeholder="이름 입력" required />
      </div>
      <div class="form-group">
        <label for="signup-username">아이디</label>
        <input type="text" id="signup-username" placeholder="아이디 입력" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="signup-password">비밀번호</label>
        <input type="password" id="signup-password" placeholder="비밀번호 입력 (4자 이상)" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="signup-confirm">비밀번호 확인</label>
        <input type="password" id="signup-confirm" placeholder="비밀번호 재입력" autocomplete="new-password" required />
      </div>
      <p class="form-message" id="signup-msg"></p>
      <button type="submit" class="btn-primary full">회원가입</button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
