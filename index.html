<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>칸반보드</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-container">
    <div class="auth-logo">
      <h1>칸반보드</h1>
      <p>업무를 한눈에 관리하세요</p>
    </div>

    <div class="auth-tabs">
      <button class="tab-btn active" id="login-tab">로그인</button>
      <button class="tab-btn" id="signup-tab">회원가입</button>
    </div>

    <!-- 로그인 -->
    <form id="login-form" class="auth-form active" novalidate>
      <div class="form-group">
        <label for="login-username">아이디</label>
        <input type="text" id="login-username" placeholder="아이디 입력" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="login-password">비밀번호</label>
        <input type="password" id="login-password" placeholder="비밀번호 입력" autocomplete="current-password" required />
      </div>
      <p class="form-message" id="login-msg"></p>
      <button type="submit" class="btn-primary full">로그인</button>
    </form>

    <!-- 회원가입 -->
    <form id="signup-form" class="auth-form" novalidate>
      <div class="form-group">
        <label for="signup-name">이름</label>
        <input type="text" id="signup-name" placeholder="이름 입력" required />
      </div>
      <div class="form-group">
        <label for="signup-username">아이디</label>
        <input type="text" id="signup-username" placeholder="아이디 입력" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label for="signup-password">비밀번호</label>
        <input type="password" id="signup-password" placeholder="비밀번호 입력 (4자 이상)" autocomplete="new-password" required />
      </div>
      <div class="form-group">
        <label for="signup-confirm">비밀번호 확인</label>
        <input type="password" id="signup-confirm" placeholder="비밀번호 재입력" autocomplete="new-password" required />
      </div>
      <p class="form-message" id="signup-msg"></p>
      <button type="submit" class="btn-primary full">회원가입</button>
    </form>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
